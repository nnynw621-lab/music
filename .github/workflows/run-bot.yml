name: Run Music Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Validate required secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEV_ID: ${{ secrets.DEV_ID }}
        run: |
          test -n "$API_ID" || (echo "Missing API_ID secret"; exit 1)
          test -n "$API_HASH" || (echo "Missing API_HASH secret"; exit 1)
          test -n "$BOT_TOKEN" || (echo "Missing BOT_TOKEN secret"; exit 1)
          test -n "$DEV_ID" || (echo "Missing DEV_ID secret"; exit 1)

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEV_ID: ${{ secrets.DEV_ID }}
        run: |
          python -u bot1.py
